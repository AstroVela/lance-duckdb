name: Build contracts

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'test/cmake/**'
      - '.github/workflows/BuildContracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install contract-test tools
        run: python -m pip install cmake==4.4.4 ninja==1.13.2 pytest==9.1.1
      - name: Check single and multi-config Cargo build graphs
        run: python test/cmake/test_rust_profiles.py
