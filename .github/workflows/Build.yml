name: Extension Build
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUSTOM_LINKER: mold
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "true"
      EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Compute DuckDB SHA
        id: duckdb-sha
        run: |
          echo "sha=$(git -C duckdb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute Build SHA
        id: build-sha
        run: |
          echo "sha=${{ hashFiles('CMakeLists.txt', 'extension_config.cmake', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        run: |
          mkdir -p .ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .ccache
          key: ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev ninja-build ccache mold

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build
        run: |
          GEN=ninja make release -j 4

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-release-${{ github.sha }}
          path: |
            build/release/test/unittest
            build/release/src/libduckdb.so*
          if-no-files-found: error

      - name: Save ccache
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .ccache
          key: ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-${{ github.sha }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-release-${{ github.sha }}
          path: build/release

      - name: Ensure test runner is executable
        run: |
          chmod +x ./build/release/test/unittest

      - name: Run tests
        run: |
          ./build/release/test/unittest "test/*"

  test_s3:
    name: Test S3 (MinIO)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-release-${{ github.sha }}
          path: build/release

      - name: Ensure test runner is executable
        run: |
          chmod +x ./build/release/test/unittest

      - name: Start MinIO
        run: |
          docker run -d --rm \
            --name lance-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:03a0bdbcefdac884210e9a5881085fb9b1c555e292a83987e5e110368f78ab96 \
            server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:9000/minio/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          exit 1

      - name: Upload test dataset to MinIO
        run: |
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsSL \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-01-17T23-25-50Z" \
            -o "${RUNNER_TEMP}/mc"
          mc_sha256="2da8a55896bccb7cb5a29a7f907455c3b1a83eb9f51b10e4b4fbc9bff206e43d"
          echo "${mc_sha256}  ${RUNNER_TEMP}/mc" | sha256sum --check -
          chmod +x "${RUNNER_TEMP}/mc"
          "${RUNNER_TEMP}/mc" alias set local \
            http://127.0.0.1:9000 minioadmin minioadmin
          "${RUNNER_TEMP}/mc" mb --ignore-existing local/lance-test
          "${RUNNER_TEMP}/mc" mirror --overwrite \
            test/data/test_data.lance local/lance-test/test_data.lance
          "${RUNNER_TEMP}/mc" mirror --overwrite \
            test/data/search_test_data.lance local/lance-test/search_test_data.lance

      - name: Run S3 tests
        env:
          LANCE_TEST_S3: "1"
        run: |
          ./build/release/test/unittest "test/*"

      - name: Cleanup MinIO
        if: always()
        run: |
          docker logs lance-minio || true
          docker rm -f lance-minio || true
