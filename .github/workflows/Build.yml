name: Extension Build
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      CUSTOM_LINKER: mold
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "true"
      EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Compute DuckDB SHA
        id: duckdb-sha
        run: |
          echo "sha=$(git -C duckdb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute Build SHA
        id: build-sha
        run: |
          echo "sha=${{ hashFiles('CMakeLists.txt', 'extension_config.cmake', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        run: |
          mkdir -p .ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
          key: ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev ninja-build ccache mold

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          GEN=ninja make release -j 4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-release-${{ github.sha }}
          path: |
            build/release/test/unittest
            build/release/src/libduckdb.so*
            build/release/extension/lance/lance_blob_filesystem_test
          if-no-files-found: error

      - name: Save ccache
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
          key: ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-${{ github.sha }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-release-${{ github.sha }}
          path: build/release

      - name: Ensure test runner is executable
        run: |
          chmod +x ./build/release/test/unittest

      - name: Run tests
        run: |
          ./build/release/test/unittest "test/*"

      - name: Test Blob FileHandle semantics and snapshot mutations
        run: |
          chmod +x build/release/extension/lance/lance_blob_filesystem_test
          python3 -m venv build/blob-tests
          build/blob-tests/bin/pip install pylance==9.0.1 pyarrow==22.0.0
          build/blob-tests/bin/python test/scripts/run_blob_filesystem_tests.py \
            build/release/extension/lance/lance_blob_filesystem_test

  test_s3:
    name: Test S3 (MinIO)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-release-${{ github.sha }}
          path: build/release

      - name: Ensure test runner is executable
        run: |
          chmod +x ./build/release/test/unittest

      - name: Start MinIO
        run: |
          ./scripts/build_minio_test_images.sh RELEASE.2025-09-07T16-13-09Z
          docker run -d --rm --pull never \
            --name lance-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            astrovela-minio-test:RELEASE.2025-09-07T16-13-09Z \
            server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:9000/minio/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          exit 1

      - name: Upload test dataset to MinIO
        run: |
          docker run --rm --pull never \
            --network container:lance-minio \
            --volume "${GITHUB_WORKSPACE}/test/data:/fixtures:ro" \
            --env MC_HOST_local=http://minioadmin:minioadmin@127.0.0.1:9000 \
            --entrypoint /bin/sh \
            astrovela-mc-test:RELEASE.2025-08-13T08-35-41Z \
            -ec '
              mc mb --ignore-existing local/lance-test
              mc mirror --overwrite /fixtures/test_data.lance local/lance-test/test_data.lance
              mc mirror --overwrite /fixtures/search_test_data.lance local/lance-test/search_test_data.lance
              mc mirror --overwrite /fixtures/blob_v2_fixture.lance local/lance-test/blob_v2_fixture.lance
              mc admin user add local blob-dataset blob-dataset-password
              mc admin user add local blob-external blob-external-password
              mc admin policy create local blob-dataset /fixtures/blob_s3_dataset_policy.json
              mc admin policy create local blob-external /fixtures/blob_s3_external_policy.json
              mc admin policy attach local blob-dataset --user blob-dataset
              mc admin policy attach local blob-external --user blob-external
            '

      - name: Run S3 tests
        env:
          LANCE_TEST_S3: "1"
        run: |
          ./build/release/test/unittest "test/*"

      - name: Test Blob target secrets and bounded HTTP reads
        env:
          LANCE_TEST_S3: "1"
          LANCE_BLOB_S3_DATASET_KEY: blob-dataset
          LANCE_BLOB_S3_DATASET_SECRET: blob-dataset-password
          LANCE_BLOB_S3_EXTERNAL_KEY: blob-external
          LANCE_BLOB_S3_EXTERNAL_SECRET: blob-external-password
        run: |
          chmod +x build/release/extension/lance/lance_blob_filesystem_test
          python3 -m venv build/blob-tests
          build/blob-tests/bin/pip install pylance==9.0.1 pyarrow==22.0.0 boto3
          build/blob-tests/bin/python test/scripts/run_s3_blob_filesystem_tests.py \
            build/release/extension/lance/lance_blob_filesystem_test

      - name: Cleanup MinIO
        if: always()
        run: |
          docker logs lance-minio || true
          docker rm -f lance-minio || true
