name: Vane distributed Lance scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vane-extension:
    name: Vane ABI and static wheel
    permissions:
      contents: read
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@28c253d71645b627e90307a8c0f42bf74bda0046
    with:
      ci_tools_version: 28c253d71645b627e90307a8c0f42bf74bda0046
      manifest: vane-extension.toml
      build_jobs: 8

  distributed-scan:
    name: Two-worker distributed scan
    needs: vane-extension
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: "true"
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: minioadmin
      LANCE_S3_BUCKET: lance-vane-test
      LANCE_TEST_S3: "1"
      RAY_DEDUP_LOGS: "0"
      VANE_RUNNER: ray
    steps:
      - name: Checkout tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the verified static wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vane-lance-wheel
          path: ${{ runner.temp }}/vane-lance-wheel

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact wheel in a fresh environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/vane-lance-test"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/vane-lance-wheel" \
            -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one Vane Lance wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/vane-lance-test/bin/python" -m pip install \
            "${wheels[0]}" \
            "grpcio>=1.42.0" \
            "pytest>=8" \
            "ray==2.58.0"

      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name lance-vane-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:03a0bdbcefdac884210e9a5881085fb9b1c555e292a83987e5e110368f78ab96 \
            server /data

      - name: Wait for MinIO and create the test bucket
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "${AWS_ENDPOINT_URL}/minio/health/ready" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "MinIO did not become ready" >&2
              docker logs lance-vane-minio
              exit 1
            fi
            sleep 1
          done
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsSL \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-01-17T23-25-50Z" \
            -o "${RUNNER_TEMP}/mc"
          mc_sha256="2da8a55896bccb7cb5a29a7f907455c3b1a83eb9f51b10e4b4fbc9bff206e43d"
          echo "${mc_sha256}  ${RUNNER_TEMP}/mc" | sha256sum --check -
          chmod +x "${RUNNER_TEMP}/mc"
          "${RUNNER_TEMP}/mc" alias set local "${AWS_ENDPOINT_URL}" \
            "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"
          "${RUNNER_TEMP}/mc" mb --ignore-existing "local/${LANCE_S3_BUCKET}"

      - name: Run distributed scan contracts
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/vane-lance-test/bin/python" -m pytest -q \
            "${GITHUB_WORKSPACE}/python/tests/test_vane_distributed_scan.py"

      - name: Stop MinIO
        if: always()
        shell: bash
        run: |
          docker logs lance-vane-minio || true
          docker rm -f lance-vane-minio || true
