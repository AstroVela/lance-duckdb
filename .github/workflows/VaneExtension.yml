          python -m venv "${RUNNER_TEMP}/vane-lance-distributed"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/vane-lance-wheel" \
            -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one Vane Lance wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/vane-lance-distributed/bin/python" -m pip install \
            "${wheels[0]}" \
            "grpcio>=1.42.0" \
            "pytest>=8" \
            "ray==2.58.0"

      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name lance-vane-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:03a0bdbcefdac884210e9a5881085fb9b1c555e292a83987e5e110368f78ab96 \
            server /data

      - name: Wait for MinIO and create the test bucket
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "${AWS_ENDPOINT_URL}/minio/health/ready" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "MinIO did not become ready" >&2
              docker logs lance-vane-minio
              exit 1
            fi
            sleep 1
          done
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsSL \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-01-17T23-25-50Z" \
            -o "${RUNNER_TEMP}/mc"
          mc_sha256="2da8a55896bccb7cb5a29a7f907455c3b1a83eb9f51b10e4b4fbc9bff206e43d"
          echo "${mc_sha256}  ${RUNNER_TEMP}/mc" | sha256sum --check -
          chmod +x "${RUNNER_TEMP}/mc"
          "${RUNNER_TEMP}/mc" alias set local "${AWS_ENDPOINT_URL}" \
            "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"
          "${RUNNER_TEMP}/mc" mb --ignore-existing "local/${LANCE_S3_BUCKET}"

      - name: Run distributed scan contracts
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/vane-lance-distributed/bin/python" -m pytest -q \
            "${GITHUB_WORKSPACE}/python/tests/test_vane_distributed_scan.py"

      - name: Stop MinIO
        if: always()
        shell: bash
        run: |
          docker logs lance-vane-minio || true
          docker rm -f lance-vane-minio || true

