name: Extension Code Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  code-quality:
    name: C++ code quality
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@de54d6cef550b4b54cc3e817eeb8c4415faf6c35
    with:
      extension_name: lance
      duckdb_version: v1.5-variegata
      ci_tools_version: de54d6cef550b4b54cc3e817eeb8c4415faf6c35

  rust-quality:
    name: Rust code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Rust sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check the default Rust feature set
        run: cargo check --locked

      - name: Run Rust clippy with Vane support
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  python-quality:
    name: Python test quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Python tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check Python test formatting and syntax
        run: |
          python -m pip install "black==24.10.0"
          python -m black --check python/tests
          python -m compileall -q python/tests
