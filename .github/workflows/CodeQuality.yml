name: Extension Code Quality
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@de54d6cef550b4b54cc3e817eeb8c4415faf6c35
    with:
      extension_name: lance
      duckdb_version: v1.5-variegata
      ci_tools_version: de54d6cef550b4b54cc3e817eeb8c4415faf6c35
