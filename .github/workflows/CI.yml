name: Extension CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: CI contract preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DUCKDB_CI_TOOLS_VERSION: 401cc753a9251216567652ed06b456a20f74c9b0
      VANE_CI_TOOLS_VERSION: 28c253d71645b627e90307a8c0f42bf74bda0046
    steps:
      - name: Checkout CI inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate manifests and pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          full_sha = re.compile(r"[0-9a-f]{40}")
          manifest = tomllib.loads(Path("vane-extension.toml").read_text())
          if manifest.get("schema_version") != 1:
              raise SystemExit("vane-extension.toml schema_version must be 1")
          vane = manifest.get("vane")
          if not isinstance(vane, dict):
              raise SystemExit("vane-extension.toml must contain a [vane] table")
          if vane.get("repository") != "AstroVela/vane":
              raise SystemExit("vane.repository must be AstroVela/vane")
          revision = vane.get("revision")
          if not isinstance(revision, str) or not full_sha.fullmatch(revision):
              raise SystemExit("vane.revision must be a full lowercase commit SHA")
          for key in ("extension_config", "native_test_selection"):
              value = manifest.get(key)
              if not isinstance(value, str) or not Path(value).is_file():
                  raise SystemExit(f"{key} must identify a repository file")

          vcpkg = json.loads(Path("vcpkg.json").read_text())
          baseline = vcpkg.get("builtin-baseline")
          if not isinstance(baseline, str) or not full_sha.fullmatch(baseline):
              raise SystemExit("vcpkg.json builtin-baseline must be a full SHA")
          print(f"Vane revision: {revision}")
          print(f"vcpkg baseline: {baseline}")
          PY

          verify_gitlink() {
            local path="$1"
            local expected="$2"
            local entry mode type actual actual_path
            entry="$(git ls-tree HEAD -- "${path}")"
            read -r mode type actual actual_path <<< "${entry}"
            test "${mode}" = "160000"
            test "${type}" = "commit"
            test "${actual_path}" = "${path}"
            test "${actual}" = "${expected}"
          }
          verify_gitlink extension-ci-tools "${DUCKDB_CI_TOOLS_VERSION}"
          verify_gitlink vane-extension-ci-tools "${VANE_CI_TOOLS_VERSION}"

  code-quality:
    name: C++ code quality
    needs: preflight
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@401cc753a9251216567652ed06b456a20f74c9b0
    with:
      extension_name: lance
      duckdb_version: v1.5-variegata
      ci_tools_version: 401cc753a9251216567652ed06b456a20f74c9b0

  rust-quality:
    name: Rust code quality
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Rust sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev protobuf-compiler

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check the default Rust feature set
        run: cargo check --locked

      - name: Run Rust clippy with Vane support
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  python-quality:
    name: Python test quality
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Python tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check Python test formatting and syntax
        run: |
          python -m pip install "black==24.10.0"
          python -m black --check python/tests
          python -m compileall -q python/tests

  official-build:
    name: Build official DuckDB extension
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUSTOM_LINKER: mold
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_NOHASHDIR: "true"
      EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    steps:
      - name: Checkout official DuckDB build inputs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Compute DuckDB SHA
        id: duckdb-sha
        run: echo "sha=$(git -C duckdb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute build SHA
        id: build-sha
        run: |
          echo "sha=${{ hashFiles('CMakeLists.txt', 'extension_config.cmake', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        run: mkdir -p .ccache

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-

      - name: Install official build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev ninja-build ccache mold

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build official extension
        run: GEN=ninja make release -j 4

      - name: Upload official build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-build-${{ github.sha }}
          path: |
            build/release/test/unittest
            build/release/src/libduckdb.so*
          if-no-files-found: error

      - name: Save ccache
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.duckdb-sha.outputs.sha }}-${{ steps.build-sha.outputs.sha }}-${{ github.sha }}

  vane-build:
    name: Build and verify Vane ABI and static wheel
    needs: preflight
    permissions:
      contents: read
    uses: AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@28c253d71645b627e90307a8c0f42bf74bda0046
    with:
      ci_tools_version: 28c253d71645b627e90307a8c0f42bf74bda0046
      manifest: vane-extension.toml
      build_jobs: 8

  official-test:
    name: Official single-node tests
    needs: [code-quality, rust-quality, official-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download official build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: official-build-${{ github.sha }}
          path: build/release

      - name: Run official single-node tests
        run: |
          chmod +x ./build/release/test/unittest
          ./build/release/test/unittest "test/*"

  official-s3-test:
    name: Official single-node S3 tests
    needs: [code-quality, rust-quality, official-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download official build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: official-build-${{ github.sha }}
          path: build/release

      - name: Start MinIO
        run: |
          docker run -d --rm \
            --name lance-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:03a0bdbcefdac884210e9a5881085fb9b1c555e292a83987e5e110368f78ab96 \
            server /data

      - name: Wait for MinIO and upload test datasets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:9000/minio/health/ready" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "MinIO did not become ready" >&2
              docker logs lance-minio
              exit 1
            fi
            sleep 1
          done
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsSL \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-01-17T23-25-50Z" \
            -o "${RUNNER_TEMP}/mc"
          mc_sha256="2da8a55896bccb7cb5a29a7f907455c3b1a83eb9f51b10e4b4fbc9bff206e43d"
          echo "${mc_sha256}  ${RUNNER_TEMP}/mc" | sha256sum --check -
          chmod +x "${RUNNER_TEMP}/mc"
          "${RUNNER_TEMP}/mc" alias set local \
            http://127.0.0.1:9000 minioadmin minioadmin
          "${RUNNER_TEMP}/mc" mb --ignore-existing local/lance-test
          "${RUNNER_TEMP}/mc" mirror --overwrite \
            test/data/test_data.lance local/lance-test/test_data.lance
          "${RUNNER_TEMP}/mc" mirror --overwrite \
            test/data/search_test_data.lance local/lance-test/search_test_data.lance

      - name: Run official S3 tests
        env:
          LANCE_TEST_S3: "1"
        run: |
          chmod +x ./build/release/test/unittest
          ./build/release/test/unittest "test/*"

      - name: Stop MinIO
        if: always()
        run: |
          docker logs lance-minio || true
          docker rm -f lance-minio || true

  vane-single-test:
    name: Vane single-node scan
    needs: [code-quality, rust-quality, python-quality, vane-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the verified static wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vane-lance-wheel
          path: ${{ runner.temp }}/vane-lance-wheel

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact wheel in a fresh environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/vane-lance-single"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/vane-lance-wheel" \
            -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one Vane Lance wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/vane-lance-single/bin/python" -m pip install \
            "${wheels[0]}" \
            "pytest>=8" \
            "ray==2.58.0"

      - name: Run Vane single-node scan tests
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/vane-lance-single/bin/python" -m pytest -q \
            "${GITHUB_WORKSPACE}/python/tests/test_vane_single_scan.py"

  vane-distributed-test:
    name: Vane two-worker distributed scan
    needs: [code-quality, rust-quality, python-quality, vane-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_ALLOW_HTTP: "true"
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: minioadmin
      LANCE_S3_BUCKET: lance-vane-test
      LANCE_TEST_S3: "1"
      RAY_DEDUP_LOGS: "0"
      VANE_RUNNER: ray
    steps:
      - name: Checkout tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the verified static wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vane-lance-wheel
          path: ${{ runner.temp }}/vane-lance-wheel

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the exact wheel in a fresh environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/vane-lance-distributed"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/vane-lance-wheel" \
            -maxdepth 1 -type f -name '*.whl' -print | sort)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one Vane Lance wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/vane-lance-distributed/bin/python" -m pip install \
            "${wheels[0]}" \
            "grpcio>=1.42.0" \
            "pytest>=8" \
            "ray==2.58.0"

      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name lance-vane-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:03a0bdbcefdac884210e9a5881085fb9b1c555e292a83987e5e110368f78ab96 \
            server /data

      - name: Wait for MinIO and create the test bucket
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS "${AWS_ENDPOINT_URL}/minio/health/ready" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "MinIO did not become ready" >&2
              docker logs lance-vane-minio
              exit 1
            fi
            sleep 1
          done
          curl --retry 5 --retry-delay 1 --retry-all-errors -fsSL \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-01-17T23-25-50Z" \
            -o "${RUNNER_TEMP}/mc"
          mc_sha256="2da8a55896bccb7cb5a29a7f907455c3b1a83eb9f51b10e4b4fbc9bff206e43d"
          echo "${mc_sha256}  ${RUNNER_TEMP}/mc" | sha256sum --check -
          chmod +x "${RUNNER_TEMP}/mc"
          "${RUNNER_TEMP}/mc" alias set local "${AWS_ENDPOINT_URL}" \
            "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"
          "${RUNNER_TEMP}/mc" mb --ignore-existing "local/${LANCE_S3_BUCKET}"

      - name: Run distributed scan contracts
        shell: bash
        env:
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/vane-lance-distributed/bin/python" -m pytest -q \
            "${GITHUB_WORKSPACE}/python/tests/test_vane_distributed_scan.py"

      - name: Stop MinIO
        if: always()
        shell: bash
        run: |
          docker logs lance-vane-minio || true
          docker rm -f lance-vane-minio || true
